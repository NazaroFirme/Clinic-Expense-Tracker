kind = "web"
previewPath = "/"
title = "ELO Clínica — Gestão Financeira"
description = "Dashboard financeiro da ELO Clínica para registrar gastos, acompanhar o orçamento, analisar categorias e manter uma visão clara da operação administrativa."
version = "1.0.0"
id = "artifacts/clinica-gastos"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18162

[services.development]
run = "pnpm --filter @workspace/clinica-gastos run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clinica-gastos", "run", "build" ]
serve = "static"
publicDir = "artifacts/clinica-gastos/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18162"
BASE_PATH = "/"
